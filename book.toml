[book]
title = "Crafting Code B3"
authors = ["Yoan Thirion"]
language = "fr"
src = "."

[output.html]
default-theme = "rust"
site-url = "/crafting-code-b3/"
git-repository-url = "https://github.com/ythirion/crafting-code-b3"
additional-js = ["js/mermaid.min.js", "js/mermaid-init.js"]

[output.html.search]
enable = true

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.playground]
editable = false
